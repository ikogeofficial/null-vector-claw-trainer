<style>
  :root{
    --bg:#07090a; --line:#1c2b23; --phosphor:#3dff9e;
    --amber:#ffb03d; --ink:#cfe8dc; --ink-dim:#5f7a6d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; height:100%; width:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center;
  }
  #scan{
    position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  #wrap{ text-align:center; padding:24px; max-width:340px; }
  h1{
    font-size:22px; letter-spacing:5px; color:var(--phosphor); margin:0 0 4px;
    text-shadow:0 0 10px rgba(61,255,158,0.5);
  }
  .sub{ font-size:10px; letter-spacing:2px; color:var(--ink-dim); margin-bottom:34px; }
  .modeBtn{
    display:block; width:100%; margin-bottom:16px; padding:18px 14px;
    background:rgba(13,18,16,0.4); border:1px solid var(--line); border-radius:2px;
    color:var(--ink); text-decoration:none; text-align:left;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .modeBtn .t{ font-size:14px; letter-spacing:2px; color:var(--phosphor); }
  .modeBtn .d{ font-size:10px; color:var(--ink-dim); margin-top:4px; letter-spacing:0.5px; }
  .modeBtn:active{ border-color:var(--phosphor); box-shadow:0 0 16px rgba(61,255,158,0.2) inset; }
  #modeBtn2 .t{ color:var(--amber); }
  #modeBtn2:active{ border-color:var(--amber); box-shadow:0 0 16px rgba(255,176,61,0.2) inset; }
  footer{ margin-top:20px; font-size:9px; color:var(--ink-dim); letter-spacing:1px; }
</style>
